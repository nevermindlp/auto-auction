# 固定 ROI：与标定时分辨率 / 显示缩放一致
# 坐标均为相对 screen.roi 的像素（点击点与 OCR 矩形）

screen:
  roi:
    x: 0
    y: 0
    width: 800
    height: 600

scan:
  max_pages: 20
  price_threshold: 50000
  color_line_ratio: 0.98
  slot_count: 8
  after_click_sec: 0.6
  after_page_sec: 1.0
  loop_idle_sec: 0.05
  dry_run: false
  save_debug: true

clicks:
  next_page: { x: 700, y: 550 }
  favorite: { x: 400, y: 500 }
  close_detail: { x: 50, y: 50 }
  slots:
    - { x: 200, y: 120 }
    - { x: 500, y: 120 }
    - { x: 200, y: 220 }
    - { x: 500, y: 220 }
    - { x: 200, y: 320 }
    - { x: 500, y: 320 }
    - { x: 200, y: 420 }
    - { x: 500, y: 420 }

ocr_regions:
  slots:
    - price: { x: 150, y: 100, w: 100, h: 28 }
    - price: { x: 450, y: 100, w: 100, h: 28 }
    - price: { x: 150, y: 200, w: 100, h: 28 }
    - price: { x: 450, y: 200, w: 100, h: 28 }
    - price: { x: 150, y: 300, w: 100, h: 28 }
    - price: { x: 450, y: 300, w: 100, h: 28 }
    - price: { x: 150, y: 400, w: 100, h: 28 }
    - price: { x: 450, y: 400, w: 100, h: 28 }
  detail:
    total_growth: { x: 300, y: 200, w: 120, h: 32 }
    current_growth: { x: 300, y: 240, w: 120, h: 32 }

click:
  coordinate_scale_x: 1.0
  coordinate_scale_y: 1.0

platform: auto

paths:
  debug_dir: artifacts/debug
  hits_dir: artifacts/hits

logging:
  level: INFO
